# The site's prose and the README, for their writers to check. The rules
# are styles/Flume, copied from the design books' voice in
# boomdrivedev/blueprints (books/VOICE.md): present tense, the actor as the
# subject, nothing sold, nothing hedged. `prose` from the devenv shell runs
# them; no task or workflow does (core.21; record 0074).
StylesPath = styles
Vocab = Flume
MinAlertLevel = suggestion

[*.{md,mdx}]
BasedOnStyles = Vale, Flume
Vale.Spelling = NO
# Starlight's directives, import lines and component tags are not prose.
TokenIgnores = (:::[a-z]+(?:\[[^\]]*\])?), (^import .*$), (<[A-Z][A-Za-z]*[^>]*/?>), (</[A-Z][A-Za-z]*>)
