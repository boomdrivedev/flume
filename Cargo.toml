# flume's crates: the seams, the core over them, the fakes, the
# conformance suite and the binary. Each is a moon project of its own
# (core.21), and a profile's crate is added to `members` by the unit that
# writes it.
[workspace]
resolver = "2"
members = [
  "crates/flume-seams",
  "crates/flume-fakes",
  "crates/flume-conformance",
  "crates/flume-core",
  "crates/flume",
]

[workspace.package]
# 0.0.0 on main. A release's version is written here, into Cargo.lock and
# into each plugin's manifest in the release commit its tag names
# (set-version.sh, .github/workflows/ci.yml); root:versions holds them
# equal.
version = "0.34.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# weir's four crates, the kind format, the engine that ticks a statechart
# kind, the delivery form and the pack that holds a store of deliveries to
# it, taken at one revision of weir's main, the four moved together by a
# chore when weir changes (core.4, core.22, core.42).
weir-kinds = { git = "https://github.com/boomdrivedev/weir", rev = "cc9d41fba5e47b25ed1dde90c380d3c9f56a1785" }
weir-engine = { git = "https://github.com/boomdrivedev/weir", rev = "cc9d41fba5e47b25ed1dde90c380d3c9f56a1785" }
weir-delivery = { git = "https://github.com/boomdrivedev/weir", rev = "cc9d41fba5e47b25ed1dde90c380d3c9f56a1785" }
weir-pack = { git = "https://github.com/boomdrivedev/weir", rev = "cc9d41fba5e47b25ed1dde90c380d3c9f56a1785" }
# The engine's times, a statechart region's entered time and a snapshot's
# moment, at the version weir's engine reads them in.
time = "0.3"
toml = "1"
clap = { version = "4", features = ["derive"] }
# The digest of a prompt an agent acks received, and of the plugin a
# binary writes (design 14).
sha2 = "0.10"
# The digests of a start's record, keyed by the start's secret (design 7
# of record 0020's change).
hmac = "0.12"
# The host's process table, read for a command's start (design 11).
libc = "0.2"
# The zone a usage limit's reset is named in, and the dates read in it
# (design 6 of record 0020's change).
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false }
# OpenTelemetry at sluice's versions, OTLP over HTTP in protobuf through
# the crate's blocking reqwest client and no TLS, since the collector is
# on the host's loopback; the binary's alone, the core naming no crate of
# them (216; design 2, 6).
opentelemetry = { version = "0.33", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
  "http-proto",
  "reqwest-blocking-client",
] }
