# The stage template flume binds, `stage`, a statechart of flume's own in the
# family's kind format, version 1 (175, 178, C.2). A state of a statechart
# kind that runs it is a stage of the kind: its region `run` starts at
# `working`, asks for the stage's sessions by `start_sessions` until
# `stage.started` proves them recorded, and moves to the final state its
# `stage.end` names. The core reads it only through the kinds seam (core.4).

[kinds.stage]
version = 1
title = "A stage's sessions, joined"

[kinds.stage.regions.run]
initial = "working"

[kinds.stage.regions.run.states.working]
transitions = [
  { when = { ev = "stage.end", is = "passed" }, to = "passed" },
  { when = { ev = "stage.end", is = "sent-back" }, to = "sent-back" },
  { when = { ev = "stage.end", is = "stopped" }, to = "stopped" },
  { when = { always = true }, to = "working", effects = [
    { do = "start_sessions" },
  ] },
]

[kinds.stage.regions.run.states.passed]
final = true

[kinds.stage.regions.run.states.sent-back]
final = true

[kinds.stage.regions.run.states.stopped]
final = true
