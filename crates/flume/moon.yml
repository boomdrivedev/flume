$schema: 'https://moonrepo.dev/schemas/project.json'

# The binary: the core built over the profiles built in, each answer
# written as JSON. Its tests run each seam's scenarios against its
# profile on scratch repositories, the pinned openspec among the tools
# they read. Each check is one task, in the fast layer, but `tools`: the
# profiles against the pinned herdr and sluice, on servers and scratch
# repositories the tests make, and the walkthroughs, the built binary
# under the printed command, or under the pinned herdr, with the stand-in
# for Claude Code (`tests/profiles/stand-in/`) on scratch repositories
# landing on a local bare remote, in the check-tools layer; and `live`, the walkthroughs with the
# pinned Claude Code under herdr, in the check-live layer, run by hand
# with a test account's token (`tests/profiles/live/`).
# Each task that builds the binary builds it in a target folder of its
# own: cargo writes `target/debug/flume` again at each build, one with
# nothing to do among them, and a gate runs its tasks at once in one
# checkout, so a test that runs the binary while another task's cargo
# writes it finds no file there, or finds a binary of other features.
# `test` keeps cargo's `target`; root:targets holds the tasks to this.
language: 'rust'
layer: 'application'
dependsOn: [seams, core, fakes, conformance]

tasks:
  format:
    command: 'cargo fmt --check -p flume'
    inputs: ['/crates/flume/**/*', '/Cargo.toml', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  lint:
    command: 'cargo clippy -p flume --all-targets --all-features -- -D warnings'
    inputs: ['/crates/flume/**/*', '/crates/flume-seams/**/*', '/crates/flume-core/**/*', '/crates/flume-fakes/**/*', '/crates/flume-conformance/**/*', '/.config/flume.toml', '/plugins/claude/**/*', '/nix/tests/files/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  test:
    command: 'cargo test -p flume'
    inputs: ['/crates/flume/**/*', '/crates/flume-seams/**/*', '/crates/flume-core/**/*', '/crates/flume-fakes/**/*', '/crates/flume-conformance/**/*', '/.config/flume.toml', '/plugins/claude/**/*', '/nix/tests/files/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # The tools tests wait on real time, herdr's and Rex's sessions, the
  # stand-in's answers and the walkthroughs' settles, and use little of
  # a processor while they wait; they run as many at once as libtest
  # takes on this host, not the share of its cores a sluice run is handed
  # (`RUST_TEST_THREADS`, devenv.nix), which ran two at a time and took
  # 581 seconds under the gate where all at once take 111.
  tools:
    script: 'unset RUST_TEST_THREADS; cargo test -p flume --features tools --test tools'
    inputs: ['/crates/flume/**/*', '/crates/flume-seams/**/*', '/crates/flume-core/**/*', '/crates/flume-fakes/**/*', '/crates/flume-conformance/**/*', '/plugins/claude/**/*', '/plugins/herdr/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    env: {CARGO_TARGET_DIR: '$workspaceRoot/target/tools'}
    tags: [check-tools]
    options: {runFromWorkspaceRoot: true}
  live:
    command: 'cargo test -p flume --features live --test live -- --nocapture'
    inputs: ['/crates/flume/**/*', '/crates/flume-seams/**/*', '/crates/flume-core/**/*', '/crates/flume-fakes/**/*', '/crates/flume-conformance/**/*', '/plugins/claude/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    env: {CARGO_TARGET_DIR: '$workspaceRoot/target/live'}
    tags: [check-live]
    options: {runFromWorkspaceRoot: true, cache: false, runInCI: false}
