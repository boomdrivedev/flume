# flume on GitHub: the fast layer runs in the devenv shell a session uses,
# on Linux and macOS, so CI and `sluice exec` hold a tree to the same rules
# (core.22), and each push to main that git-cliff finds a new version in is
# released (cliff.toml), one run at a time: its tag names a release commit
# cut from the pushed one with the release's version written into the workspace and each
# plugin's manifest (set-version.sh), and the release branch the
# marketplace is read at is moved to it. The flake's package is built on
# each runner's system (nix:build), which the gate's sandbox cannot run.
# flume's own gate is sluice (.config/sluice.toml); this is the public
# check. Each step that downloads from GitHub, the devenv shell's inputs,
# the flake's, convco's nixpkgs and weir's crates, runs through
# try-again.sh, which runs it again where GitHub turned a download away
# for a moment and fails at once on any other failure.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# The runs of pushes to main go one at a time, in the order they were
# pushed, each waiting for the one before it to end: so a run's version
# job reads the tags the release before it pushed, and two pushes never
# compute one tag (next-version.sh). GitHub keeps one run waiting: a push
# that comes while one waits takes its place, and the run it replaces is
# cancelled, its commits released by the later run, whose range runs from
# the newest tag. A pull request's run waits for no other. No job names a
# group of its own, which would wait on its own run.
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('pull-request-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fast:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # On a pull request moon compares the change against its base
      # branch, `main` by name: it needs the history and the branch.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        run: git branch main origin/main
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile add nixpkgs#devenv
      - uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: fast-${{ runner.os }}-${{ hashFiles('Cargo.lock', '.prototools') }}
          restore-keys: fast-${{ runner.os }}-
      - run: sh try-again.sh devenv shell -- moon run ':#check-fast'

  # The flake's package, built for each runner's system in the devenv
  # shell: a package that no longer builds, a git crate's hash a weir bump
  # left behind among causes, fails here before a release carries it.
  flake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile add nixpkgs#devenv
      - run: sh try-again.sh devenv shell -- moon run nix:build

  # The commits since the last release are conventional (.versionrc): a
  # session can skip the commit-msg hook, and git-cliff releases from them.
  # The newest tag names a release commit off main, so the range runs from
  # the newest tag by version, not from the newest main's history holds.
  # Merge commits are not checked, nor a commit `git revert` wrote, its
  # message starting `Revert "`, which the commit-msg hook takes too
  # (devenv.nix) and git-cliff leaves out of a release (cliff.toml).
  # convco is the hook's: the one of the nixpkgs devenv.lock pins, which
  # the binary cache holds, so a session and CI hold a commit to one
  # convco (core.22). The registry's nixpkgs floats, and its convco 0.7.2
  # built from source on 2026-11-14 and failed, finding no libgit2 it takes.
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: |
          last="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          nixpkgs="$(jq -r '.nodes.nixpkgs.locked | "github:\(.owner)/\(.repo)/\(.rev)"' devenv.lock)"
          sh try-again.sh nix shell "$nixpkgs#convco" -c convco check --ignore-reverts ${last:+"$last..HEAD"}

  # The next version from the commits since the newest v* tag, the tags
  # the run holds as it starts; empty when it is already tagged
  # (next-version.sh). `--unreleased` starts the range at the newest tag,
  # which is off main's history. git-cliff is the nixpkgs devenv.lock pins,
  # the one devenv.nix holds to its pin (core.22).
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - id: next
        run: |
          nixpkgs="$(jq -r '.nodes.nixpkgs.locked | "github:\(.owner)/\(.repo)/\(.rev)"' devenv.lock)"
          tag="$(nix shell "$nixpkgs#git-cliff" -c sh next-version.sh)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # The binary for each platform, built by the Rust rust-toolchain.toml
  # names from the tree the release commit holds: the pushed commit with
  # the release's version written (set-version.sh), so it carries the
  # version its plugins do. Linux's is static, against musl, and macOS's
  # links only the system's libraries, so each runs on a host with no Nix
  # and no Rust.
  binaries:
    if: needs.version.outputs.tag != ''
    needs: [version, fast, conventional]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            system: aarch64-linux
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            system: aarch64-darwin
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          rustup target add "$TARGET"
      - run: |
          sh set-version.sh "${TAG#v}"
          sh try-again.sh cargo build --release --locked -p flume --bin flume --target "$TARGET"
          test "$("target/$TARGET/release/flume" --version)" = "flume ${TAG#v}"
          tar -czf "flume-${{ matrix.system }}.tar.gz" -C "target/$TARGET/release" flume
      - uses: actions/upload-artifact@v4
        with:
          name: flume-${{ matrix.system }}
          path: flume-${{ matrix.system }}.tar.gz

  # git-cliff's notes for the range, then the release commit: the pushed
  # commit with the release's version written into the files that carry it
  # (set-version.sh), which the tag names, herdr installs the plugin at,
  # and the release branch, which the marketplace is read at, is moved to.
  # It publishes the binaries under the tag. Nothing is committed to main,
  # which only sluice lands.
  release:
    needs: [version, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: |
          nixpkgs="$(jq -r '.nodes.nixpkgs.locked | "github:\(.owner)/\(.repo)/\(.rev)"' devenv.lock)"
          nix shell "$nixpkgs#git-cliff" -c \
            git-cliff --unreleased --tag "$TAG" --strip all > notes.md
          sh set-version.sh "${TAG#v}"
          # The files set-version.sh wrote are the only tracked ones changed.
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -a -m "chore(release): $TAG"
          git tag "$TAG"
          git push --atomic origin "refs/tags/$TAG" "+HEAD:refs/heads/release"
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file notes.md flume-*.tar.gz
        env:
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
